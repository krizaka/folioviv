name: CI
# main is protected by a merge queue (merge_group below): a pull request merges only after CI passes on its entry.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The pipeline is the org's (krizaka/.github docs/standards/ci-and-deploy.md): the changes gate, the pnpm and Playwright caches,
  # the timeouts and the gate that always reports live there. This file says only what is Folioviv's.
  ci:
    uses: krizaka/.github/.github/workflows/node-ci.yml@b44f5bd2fd388e70c62d22542f61eb7d4d9939ee # main (merge queue reuses a proven pull-request run, krizaka-internal#4840)
    permissions:
      contents: read
      actions: read # node-ci's sonar job reads the coverage of the pull-request run that proved a merge-queue entry
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    with:
      # SonarCloud CI analysis after the tests, with the coverage of every package (krizaka/.github#237).
      sonar: true
      sonar-coverage-paths: |
        coverage/lcov.info
        apps/*/coverage/lcov.info
        packages/*/coverage/lcov.info
      test-script: test:coverage
      # CI_SLEEP (README, « CI sleep »): the image build and the build + SEO/overflow leg sleep; lint, typecheck, tests, Sonar, duplication and the CI gate keep running.
      container: ${{ vars.CI_SLEEP != 'true' }} # the image is built on every PR that can break it (Dockerfile, manifests, lockfiles, COPY paths)
      build-script: ${{ vars.CI_SLEEP != 'true' && 'build' || '' }}
      container-dockerfile: deploy/docker/Dockerfile
      container-image: app:ci
      # What App Platform passes as build arguments: indexing off (a dev build), a placeholder commit.
      container-build-args: |
        APP_SEARCH_INDEXING=off
        APP_COMMIT_SHA=ci
      duplication: true # jscpd + dup-ratchet.json: duplicated lines may only go down
      package-manager: pnpm
      # The build + SEO/overflow checks take 24-25 min on a busy runner: the 25 min default cancelled Verify (build) on #594 and #627 (2026-10-30). The merge queue allows 60.
      timeout-minutes: 40
      parallel: true # lint, typecheck, tests and build+SEO/overflow checks side by side
      typecheck-script: typecheck
      format-script: format:check # prettier --check, with the lint step (the `formatter` rule, krizaka/.github#427)
      next-cache-paths: apps/web/.next/cache
      postgres-image: postgres:16
      postgres-name: folioviv
      # Test values only — no real secret anywhere. APP_SEARCH_INDEXING=on: the SEO family contract (seo:check) is checked on the open site, so that it holds the day the site opens; the closed state is unit-tested. The database tests create a database per file on this server.
      env: |
        DATABASE_URL=postgresql://folioviv:ci-only-password@localhost:5432/folioviv
        DATABASE_IT=1
        APP_PUBLIC_URL=http://localhost:3000
        APP_SEARCH_INDEXING=on
      playwright: chromium
      # SEO family contract on the built site, sign-up closed, no horizontal overflow (scripts/ci-after-build.sh).
      after-build: ${{ vars.CI_SLEEP != 'true' && 'scripts/ci-after-build.sh' || '' }}
      # Files no test or build reads skip the heavy jobs (docs/, policy text, templates, the README's images). Fails open.
      ignore: '^docs/|^\.changeset/|^(LICENSE|SECURITY|CODE_OF_CONDUCT|SUPPORT)(\.md)?$|^\.github/(ISSUE_TEMPLATE/|assets/|pull_request_template\.md$|FUNDING\.yml$|dependabot\.yml$)'

  # Rule public-no-founder-name (krizaka-restricted#375): no public file names the founder, compared by keyed HMAC. This job is the
  # only one that receives the secret FOUNDER_NAME_GUARD, in its last step; without it the job fails, except on a fork's pull request.
  founder-name:
    name: Founder name guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: No public file names the founder (keyed HMAC)
        env:
          FOUNDER_NAME_GUARD: ${{ secrets.FOUNDER_NAME_GUARD }}
          FOUNDER_NAME_GUARD_REQUIRED: ${{ !(github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork) }}
        run: node scripts/check-founder-name.mjs
