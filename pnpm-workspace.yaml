packages:
  - "apps/*"
  - "packages/*"
onlyBuiltDependencies:
  - esbuild
  - sharp
  - unrs-resolver

# Dependabot: @esbuild-kit/core-utils (drizzle-kit) pins esbuild 0.18.20, whose dev-server CORS flaw is fixed from 0.25.0.
overrides:
  "esbuild@0.18.20": "0.25.12"
  "undici@8.12.1": "8.12.3" # GHSA-2m5v-pch6-74hx and 7 more: testcontainers pins 8.12.1 (krizaka/.github#372)
  "minimatch@>=7.0.0 <11.0.1": "11.0.8" # GHSA-g3hv-75wg-m249: dev tooling pulls 9.x/10.x (typescript-estree, glob); minimatch@3 (ESLint) is outside the range
  "@react-email/render@2.1.1": "2.3.1" # GHSA-gcqx-w48m-w2h4: 2.1.1 (pinned by @krizaka/email) pulls html-to-text@9, which uses deepmerge 4.3.1; 2.3.1 uses html-to-text@10 (deepmerge-ts)
